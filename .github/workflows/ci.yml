name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, formato, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: Prueba end-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Solo el navegador que usa la prueba (chromium), con sus dependencias.
      - run: npx playwright install --with-deps chromium
      # El flujo e2e intercepta toda la red (Supabase y Open-Meteo) y siembra la
      # sesión; las variables VITE_* son ficticias pero deben existir y ser una
      # URL válida, o la app no arranca (src/lib/config.ts).
      - run: npm run e2e
        env:
          VITE_SUPABASE_URL: https://pruebas.supabase.co
          VITE_SUPABASE_ANON_KEY: anon-de-pruebas-e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
